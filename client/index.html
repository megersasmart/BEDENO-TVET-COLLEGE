<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f3e">
<link rel="manifest" href="manifest.json">
<title>BEDENO TVET COLLEGE</title>
<style>
:root{--g:#087f3e;--g2:#055d2d;--bg:#f3f6f4;--text:#18221c;--muted:#66736b;--line:#dfe7e2;--card:#fff;--danger:#b42318;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:var(--g);color:#fff;font-weight:700}button:hover{background:var(--g2)}button.secondary{background:#e8efeb;color:var(--text)}button.danger{background:var(--danger)}.wrap{max-width:1280px;margin:auto;padding:18px}.login{max-width:620px;margin:7vh auto}.card{background:var(--card);border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 2px 14px #0000000d;border:1px solid var(--line)}header{background:var(--g);color:#fff;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:23px}header small{opacity:.9}.status{padding:7px 10px;border-radius:20px;font-weight:700;background:#fff;color:var(--g)}.offline{background:#fff1c7;color:#765500}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--g2)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}label{font-weight:700;font-size:14px}input,select,textarea{width:100%;border:1px solid #cfd9d3;border-radius:9px;padding:11px;background:#fff}textarea{min-height:90px}.stat{background:#eef8f1;border:1px solid #d7ecdd;border-radius:12px;padding:15px}.stat b{display:block;font-size:29px;margin-top:5px}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f6f9f7}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.pass,.approved{background:#daf5e0;color:#176b2e}.fail,.rejected{background:#ffe1e1;color:#9d1c1c}.pending{background:#fff0bf;color:#775500}.info{background:#e4f0ff;color:#17518f}.feature{display:flex;flex-wrap:wrap;gap:8px}.feature span{background:#f0f4f1;padding:8px 10px;border-radius:9px}.photo-preview{width:110px;height:130px;border:1px solid #bbb;object-fit:cover;background:#f7f7f7}.searchrow{display:flex;gap:8px}.searchrow input{flex:1}.dangerText{color:var(--danger)}
/* Certificate based on the college form supplied by the user */
.certificate-page{background:#fff;padding:15px}.certificate-sheet{position:relative;width:100%;max-width:1400px;margin:auto;aspect-ratio:1.4142;background:url('assets/certificate-form.jpg') center/100% 100% no-repeat;overflow:hidden}.cert-field{position:absolute;font-family:Arial,sans-serif;color:#111;font-weight:700}.cert-photo{position:absolute;left:82.0%;top:16.2%;width:10.6%;height:15.0%;object-fit:cover;border:1px solid #222;background:#fff}.cert-trainee{left:57.5%;top:35.7%;width:31%;font-size:1.65vw;color:#008aa7;background:rgba(255,255,255,.96);padding:2px 5px}.cert-profession{left:68.5%;top:42.5%;width:25%;font-size:1.35vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-level{left:69.5%;top:48.0%;width:23%;font-size:1.35vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-period{left:69.5%;top:53.3%;width:25%;font-size:1.15vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-id{left:12.0%;top:22.5%;width:20%;font-size:1vw}.cert-name-left{left:24%;top:35.0%;width:28%;font-size:1.35vw;color:#008aa7;background:rgba(255,255,255,.96);padding:2px 5px}.cert-prof-left{left:24%;top:42.0%;width:28%;font-size:1.2vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-score{left:70%;top:60.0%;width:18%;font-size:1.3vw}.cert-date{left:61%;top:69.5%;width:25%;font-size:1.1vw}.cert-checker{left:15%;top:69.0%;width:27%;font-size:1.1vw}.cert-status{left:43%;top:83%;width:15%;font-size:1vw;text-align:center}.print-actions{display:flex;gap:8px;justify-content:center;margin:15px auto;flex-wrap:wrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid,.two{grid-template-columns:1fr}.wrap{padding:10px}header{align-items:flex-start;flex-direction:column}.login{margin:25px auto}.searchrow{flex-direction:column}.cert-trainee{font-size:2.4vw}.cert-profession,.cert-level{font-size:2.1vw}.cert-period,.cert-score{font-size:1.8vw}}
@media print{body{background:#fff}.no-print{display:none!important}.certificate-page{padding:0}.certificate-sheet{max-width:none;width:100vw;height:70.71vw;aspect-ratio:auto}.wrap,header,#tabs,.card:not(.certificate-page){display:none!important}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="card login"><h1>🏫 BEDENO TVET COLLEGE</h1><p>Training Management & Certification System</p><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password"></div><button style="width:100%" onclick="login()">LOGIN</button><p id="loginMsg" class="muted">Initial Admin: admin / admin123</p></div></div>
<div id="app" class="hidden"><header><div><h1>🏫 BEDENO TVET COLLEGE</h1><small>Training Management & Certification System</small></div><div><span id="net" class="status">Checking...</span> <button class="secondary" onclick="logout()">Logout</button></div></header><main class="wrap"><div id="who" class="card"></div><div id="tabs" class="tabs"></div><section id="dashboard"></section><section id="registration" class="hidden"></section><section id="scores" class="hidden"></section><section id="trainees" class="hidden"></section><section id="certificates" class="hidden"></section><section id="settings" class="hidden"></section></main></div>
<script>
const API=location.origin+'/api';
let token=localStorage.getItem('btc_token')||'',role=localStorage.getItem('btc_role')||'',username=localStorage.getItem('btc_user')||'';
let queue=JSON.parse(localStorage.getItem('btc_queue')||'[]');
let trainingCache=[];
const ROLE_NAMES={ADMIN:'Admin IT',COLLEGE:'Register College / Registrar',DEAN:'Dean College',COORDINATOR:'Training Coordinator',TRAINER:'Trainer',TRAINEE:'Trainee'};
const TAB_ACCESS={ADMIN:['dashboard','registration','scores','trainees','certificates','settings'],COLLEGE:['dashboard','registration','trainees','certificates'],DEAN:['dashboard','trainees','certificates'],COORDINATOR:['dashboard','scores','trainees','settings'],TRAINER:['dashboard','scores','trainees'],TRAINEE:['dashboard','trainees','certificates']};
const TAB_NAMES={dashboard:'📊 Dashboard',registration:'🆔 Registration',scores:'📝 Score Entry',trainees:'👥 Trainees',certificates:'📜 Certificates',settings:'⚙️ Settings'};
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function login(){loginMsg.textContent='Signing in...';try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:loginUser.value,password:loginPass.value})});token=d.token;role=d.role;username=d.username;localStorage.setItem('btc_token',token);localStorage.setItem('btc_role',role);localStorage.setItem('btc_user',username);boot()}catch(e){loginMsg.textContent=e.message}}
function logout(){localStorage.removeItem('btc_token');localStorage.removeItem('btc_role');localStorage.removeItem('btc_user');location.reload()}
function boot(){loginView.classList.add('hidden');app.classList.remove('hidden');who.innerHTML='<b>Logged in:</b> '+esc(username)+' &nbsp; | &nbsp; <b>Role:</b> '+esc(ROLE_NAMES[role]||role)+' <span class="badge info">Permission controlled</span>';buildTabs();show('dashboard');updateNet();window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);setInterval(syncOffline,7000)}
function buildTabs(){tabs.innerHTML=(TAB_ACCESS[role]||[]).map(id=>`<button id="tab_${id}" onclick="show('${id}')">${TAB_NAMES[id]}</button>`).join('')}
function show(id){if(!(TAB_ACCESS[role]||[]).includes(id))return;['dashboard','registration','scores','trainees','certificates','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));const b=document.getElementById('tab_'+id);if(b)b.classList.add('active');if(id==='dashboard')loadDash();if(id==='registration')loadReg();if(id==='scores')loadScores();if(id==='trainees')loadTrainees();if(id==='certificates')loadCerts();if(id==='settings')loadSettings()}
function updateNet(){const online=navigator.onLine;net.textContent=online?'ONLINE':'OFFLINE';net.className='status '+(online?'':'offline');if(online)syncOffline()}
async function syncOffline(){if(!navigator.onLine||!queue.length||!token)return;for(const item of [...queue]){try{const d=await api('/sync/trainee',{method:'POST',body:JSON.stringify(item.data)});queue=queue.filter(x=>x.local_id!==item.local_id);localStorage.setItem('btc_queue',JSON.stringify(queue));if(window.regmsg)regmsg.textContent='Offline record synced successfully. Official ID: '+d.trainee.trainee_id}catch(e){}}}
async function loadDash(){try{const d=await api('/dashboard');dashboard.innerHTML=`<div class="grid">${[['Trainees',d.trainees],['Active',d.active],['Completed',d.completed],['Pending',d.pending],['Approved',d.approved]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card"><h2>Welcome — ${esc(ROLE_NAMES[role]||role)}</h2><p>Your dashboard is permission-controlled. Available functions are shown according to your role.</p><div class="feature"><span>👥 6 Login Roles</span><span>🆔 BTC-YYYY-0001</span><span>📴 Offline Registration</span><span>🔄 Auto Sync</span><span>🎓 Level 1–4</span><span>📝 Auto Grade</span><span>📜 Dean/College Approval</span><span>📥 Excel Export</span><span>🔐 Permissions</span><span>📱 Android/PWA</span><span>💻 Windows Browser/PWA</span></div></div>`}catch(e){dashboard.innerHTML='<div class="card dangerText">'+esc(e.message)+'</div>'}}
async function loadReg(){try{const [ps,ts]=await Promise.all([api('/professions'),api('/trainings')]);trainingCache=ts;registration.innerHTML=`<div class="card"><h2>🆔 Trainee Registration</h2><p class="muted">Trainee ID is generated automatically as BTC-YYYY-0001. If the internet is unavailable, registration is saved on this device and synced automatically later.</p><div class="two"><div class="field"><label>Full Name *</label><input id="rname"></div><div class="field"><label>Phone</label><input id="rphone" inputmode="tel"></div><div class="field"><label>Gender</label><select id="rgender"><option>Male</option><option>Female</option></select></div><div class="field"><label>Gosa Ogummaa / Profession *</label><select id="rprof" onchange="filterTrainings()">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Training *</label><select id="rtraining"></select></div><div class="field"><label>Starting Level</label><select id="rlevel"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label>Training Start Date</label><input id="rstart" type="date"></div><div class="field"><label>Training End Date</label><input id="rend" type="date"></div><div class="field"><label>Trainee Photo</label><input id="rphoto" type="file" accept="image/*" onchange="previewPhoto()"><img id="photoPreview" class="photo-preview" alt="Photo preview"></div></div><button onclick="registerTrainee()">REGISTER TRAINEE</button><p id="regmsg" class="msg"></p></div>`;filterTrainings()}catch(e){registration.innerHTML='<div class="card dangerText">'+esc(e.message)+'</div>'}}
function filterTrainings(){if(!window.rprof||!window.rtraining)return;const pid=+rprof.value;const rows=trainingCache.filter(t=>+t.profession_id===pid);rtraining.innerHTML=rows.length?rows.map(t=>`<option value="${t.id}">${esc(t.name)} (${t.levels} Levels)</option>`).join(''):'<option value="">No training available</option>';const t=trainingCache.find(x=>+x.id===+(rtraining.value));rlevel.innerHTML=Array.from({length:t?.levels||4},(_,i)=>`<option>${i+1}</option>`).join('')}
function previewPhoto(){const f=rphoto.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>photoPreview.src=rd.result;rd.readAsDataURL(f)}
async function registerTrainee(){const file=rphoto.files[0];let photo=null;if(file){if(file.size>1200000){regmsg.textContent='Photo is too large. Please choose a photo under 1.2 MB.';return}photo=await fileToDataURL(file)}const data={full_name:rname.value.trim(),phone:rphone.value.trim(),gender:rgender.value,profession_id:+rprof.value,training_id:+rtraining.value,level:+rlevel.value,photo,start_date:rstart.value||null,end_date:rend.value||null};if(!data.full_name){regmsg.textContent='Full name is required';return}const local_id=crypto.randomUUID?crypto.randomUUID():'local-'+Date.now()+'-'+Math.random();data.local_id=local_id;if(!navigator.onLine){queue.push({local_id,data});localStorage.setItem('btc_queue',JSON.stringify(queue));regmsg.textContent='Saved OFFLINE. Automatic sync will happen when internet returns.';rname.value='';rphone.value='';return}try{const d=await api('/trainees',{method:'POST',body:JSON.stringify(data)});regmsg.textContent='Registered successfully. Official Trainee ID: '+d.trainee_id;rname.value='';rphone.value='';loadDash()}catch(e){regmsg.textContent=e.message}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file)})}
async function loadScores(){scores.innerHTML=`<div class="card"><h2>📝 Trainer → Score → Automatic Grade</h2><div class="searchrow"><input id="sid" placeholder="Trainee ID e.g. BTC-2026-0001"><button onclick="lookupTrainee()">SEARCH</button></div><div id="scoreInfo"></div></div>`}
async function lookupTrainee(){try{const t=await api('/trainees/'+encodeURIComponent(sid.value.trim()));scoreInfo.innerHTML=`<div class="card"><b>${esc(t.full_name)}</b> | ${esc(t.profession)} | ${esc(t.training)} | Current Level: <b>${t.current_level}</b><div class="two" style="margin-top:12px"><div class="field"><label>Level</label><select id="slevel">${Array.from({length:t.levels},(_,i)=>`<option value="${i+1}" ${i+1===t.current_level?'selected':''}>Level ${i+1}</option>`).join('')}</select></div><div class="field"><label>Score (0–100)</label><input id="sscore" type="number" min="0" max="100"></div></div><button onclick="saveScore()">SAVE SCORE & GRADE</button><p id="scoremsg" class="msg"></p><hr><b>History</b><div class="tablewrap"><table><tr><th>Level</th><th>Score</th><th>Grade</th><th>Status</th><th>Date</th></tr>${t.results.map(r=>`<tr><td>${r.level}</td><td>${r.score}</td><td>${r.grade}</td><td><span class="badge ${r.status==='PASS'?'pass':'fail'}">${r.status}</span></td><td>${r.date}</td></tr>`).join('')}</table></div></div>`}catch(e){scoreInfo.innerHTML='<p class="dangerText">'+esc(e.message)+'</p>'}}
async function saveScore(){try{const d=await api('/results',{method:'POST',body:JSON.stringify({trainee_id:sid.value.trim(),level:+slevel.value,score:+sscore.value})});scoremsg.textContent=`Saved. Grade: ${d.grade} — ${d.status}. ${d.trainee.status==='Completed'?'All levels completed.':'Next/current level: '+d.trainee.current_level}`;lookupTrainee()}catch(e){scoremsg.textContent=e.message}}
async function loadTrainees(){try{const rows=await api('/trainees');window._rows=rows;trainees.innerHTML=`<div class="card"><h2>👥 Trainee Search & List</h2><div class="searchrow"><input id="findId" placeholder="Search Trainee ID"><button onclick="searchTrainee()">SEARCH</button></div><div id="findResult"></div><hr><button onclick="exportCSV()">📥 Excel Export (CSV)</button><div class="tablewrap" style="margin-top:12px"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Profession</th><th>Training</th><th>Level</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${esc(x.trainee_id)}</td><td>${esc(x.full_name)}</td><td>${esc(x.phone||'')}</td><td>${esc(x.profession)}</td><td>${esc(x.training)}</td><td>${x.current_level}</td><td><span class="badge ${x.status==='Completed'?'approved':'info'}">${x.status}</span></td></tr>`).join('')}</table></div></div>`}catch(e){trainees.innerHTML='<div class="card dangerText">'+esc(e.message)+'</div>'}}
async function searchTrainee(){try{const t=await api('/trainees/'+encodeURIComponent(findId.value.trim()));findResult.innerHTML=`<div class="card"><h3>${esc(t.full_name)}</h3><p><b>ID:</b> ${t.trainee_id}<br><b>Profession:</b> ${esc(t.profession)}<br><b>Training:</b> ${esc(t.training)}<br><b>Current Level:</b> ${t.current_level}<br><b>Status:</b> ${t.status}<br><b>Training Period:</b> ${t.start_date||'-'} → ${t.end_date||'-'}</p><h4>Results</h4><div class="tablewrap"><table><tr><th>Level</th><th>Score</th><th>Grade</th><th>Status</th></tr>${t.results.map(r=>`<tr><td>${r.level}</td><td>${r.score}</td><td>${r.grade}</td><td>${r.status}</td></tr>`).join('')}</table></div>${t.certificate?`<p>Certificate: <span class="badge ${t.certificate.status==='APPROVED'?'approved':t.certificate.status==='REJECTED'?'rejected':'pending'}">${t.certificate.status}</span> ${t.certificate.certificate_no}</p>${t.certificate.status==='APPROVED'?`<button onclick="openCertificate('${t.certificate.certificate_no}')">📜 OPEN / PRINT CERTIFICATE</button>`:''}`:''}</div>`}catch(e){findResult.innerHTML='<p class="dangerText">'+esc(e.message)+'</p>'}}
function exportCSV(){const rows=window._rows||[];const head=['Trainee ID','Full Name','Phone','Gender','Profession','Training','Level','Status','Start Date','End Date','Registration Date'];const csv=[head,...rows.map(x=>[x.trainee_id,x.full_name,x.phone,x.gender,x.profession,x.training,x.current_level,x.status,x.start_date,x.end_date,x.registration_date])].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='BEDENO_TVET_TRAINEES.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function loadCerts(){let html='<div class="card"><h2>📜 Certificate Management</h2>';if(['ADMIN','COLLEGE','DEAN'].includes(role)){try{const p=await api('/certificates/pending');html+=`<h3>Pending Approval</h3><div class="tablewrap"><table><tr><th>Certificate</th><th>Trainee</th><th>Profession</th><th>Score</th><th>Action</th></tr>${p.map(c=>`<tr><td>${c.certificate_no}</td><td>${esc(c.full_name)}<br>${c.trainee_id}</td><td>${esc(c.profession)}</td><td>${c.final_score} (${c.final_grade})</td><td><button onclick="decision('${c.certificate_no}','APPROVED')">APPROVE</button> <button class="danger" onclick="decision('${c.certificate_no}','REJECTED')">REJECT</button></td></tr>`).join('')}</table></div>`}catch(e){html+='<p class="dangerText">'+esc(e.message)+'</p>'}}if(role==='TRAINEE'){html+=`<p>After completing Level 1–4, enter your Trainee ID and request a certificate.</p><div class="searchrow"><input id="cid" placeholder="BTC-2026-0001"><button onclick="requestCert()">REQUEST CERTIFICATE</button></div><p id="certmsg" class="msg"></p>`}html+=`<hr><div class="card"><b>Approval flow:</b> Completed → Request → PENDING → Dean/College Responsible checks → APPROVED or REJECTED → Only APPROVED certificate can be printed/finalized.</div></div>`;certificates.innerHTML=html}
async function requestCert(){try{const d=await api('/certificates/request',{method:'POST',body:JSON.stringify({trainee_id:cid.value.trim()})});certmsg.textContent='Certificate '+d.certificate_no+' is '+d.status+'.'}catch(e){certmsg.textContent=e.message}}
async function decision(no,status){const remarks=status==='REJECTED'?prompt('Reason for rejection:')||'':'';try{await api('/certificates/'+encodeURIComponent(no)+'/decision',{method:'POST',body:JSON.stringify({status,remarks})});loadCerts()}catch(e){alert(e.message)}}
async function openCertificate(no){try{const c=await api('/certificates/'+encodeURIComponent(no));const photo=c.photo||'';const start=c.start_date||'-';const end=c.end_date||'-';const approved=c.approved_at?new Date(c.approved_at).toLocaleDateString():(c.registration_date?new Date(c.registration_date).toLocaleDateString():new Date().toLocaleDateString());const win=window.open('','_blank');if(!win){alert('Please allow pop-ups for this site.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(c.certificate_no)}</title><style>@page{size:A4 landscape;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}.sheet{position:relative;width:100vw;height:70.71vw;background:url('${location.origin}/assets/certificate-form.jpg') center/100% 100% no-repeat;overflow:hidden}.f{position:absolute;font-family:Arial,sans-serif;color:#111;font-weight:700;line-height:1.15}.box{background:rgba(255,255,255,.96);padding:2px 5px}.photo{left:82%;top:16.2%;width:10.6%;height:15%;object-fit:cover;border:1px solid #222;background:#fff}.trainee{left:57.5%;top:35.7%;width:31%;font-size:1.65vw;color:#008aa7}.prof{left:68.5%;top:42.5%;width:25%;font-size:1.35vw}.level{left:69.5%;top:48%;width:23%;font-size:1.35vw}.period{left:69.5%;top:53.3%;width:25%;font-size:1.15vw}.id{left:12%;top:22.5%;font-size:1vw}.leftname{left:24%;top:35%;width:28%;font-size:1.35vw;color:#008aa7}.leftprof{left:24%;top:42%;width:28%;font-size:1.2vw}.score{left:69.5%;top:59%;font-size:1.2vw}.checker{left:15%;top:69%;font-size:1.05vw}.date{left:61%;top:69.5%;font-size:1.05vw}.status{left:43%;top:83%;width:15%;text-align:center;font-size:1vw}</style></head><body><div class="sheet">${photo?`<img class="f photo" src="${photo}">`:''}<div class="f id box">${esc(c.certificate_no)}</div><div class="f trainee box">${esc(c.full_name)}</div><div class="f prof box">${esc(c.profession)}</div><div class="f level box">Level I–${c.levels}</div><div class="f period box">${esc(start)} → ${esc(end)}</div><div class="f leftname box">${esc(c.full_name)}</div><div class="f leftprof box">${esc(c.profession)}</div><div class="f score box">${c.final_score} (${esc(c.final_grade)})</div><div class="f checker box">${esc(c.checked_by||'College Responsible')}</div><div class="f date box">${esc(approved)}</div><div class="f status box">APPROVED</div></div><script>window.onload=()=>setTimeout(()=>window.print(),700)<\/script></body></html>`);win.document.close()}catch(e){alert(e.message)}}
async function loadSettings(){if(!['ADMIN','COORDINATOR'].includes(role))return;let html='<div class="card"><h2>⚙️ Settings</h2>';if(role==='ADMIN'){try{const u=await api('/users');html+=`<h3>🔐 User & Permission Security</h3><div class="two"><div class="field"><label>Username</label><input id="nu"></div><div class="field"><label>Password</label><input id="np" type="password"></div><div class="field"><label>Role</label><select id="nr">${Object.entries(ROLE_NAMES).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div></div><button onclick="addUser()">CREATE USER</button><div class="tablewrap" style="margin-top:15px"><table><tr><th>Username</th><th>Role</th><th>Active</th><th>Action</th></tr>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${ROLE_NAMES[x.role]||x.role}</td><td>${x.active?'YES':'NO'}</td><td>${x.username==='admin'?'Protected':`<button class="secondary" onclick="toggleUser(${x.id})">${x.active?'Disable':'Enable'}</button>`}</td></tr>`).join('')}</table></div>`}catch(e){html+='<p class="dangerText">'+esc(e.message)+'</p>'}}html+=`<hr><h3>🎓 Training Management</h3><div class="two"><div class="field"><label>Profession ID</label><input id="tp" type="number"></div><div class="field"><label>Training Name</label><input id="tn"></div><div class="field"><label>Levels (1–4)</label><select id="tl"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div><div class="field"><label>Pass Mark</label><input id="tm" type="number" value="60"></div></div><button onclick="addTraining()">ADD TRAINING</button><p id="setmsg" class="msg"></p></div>`;settings.innerHTML=html}
async function addUser(){try{await api('/users',{method:'POST',body:JSON.stringify({username:nu.value.trim(),password:np.value,role:nr.value})});setmsg.textContent='User created successfully';loadSettings()}catch(e){setmsg.textContent=e.message}}
async function toggleUser(id){try{await api('/users/'+id+'/toggle',{method:'POST'});loadSettings()}catch(e){alert(e.message)}}
async function addTraining(){try{await api('/trainings',{method:'POST',body:JSON.stringify({profession_id:+tp.value,name:tn.value.trim(),levels:+tl.value,pass_mark:+tm.value})});setmsg.textContent='Training created successfully';loadSettings()}catch(e){setmsg.textContent=e.message}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
if(token)boot();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body></html>
