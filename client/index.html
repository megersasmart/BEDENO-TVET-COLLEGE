<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f3e">
<link rel="manifest" href="manifest.json">
<title>BEDENO TVET COLLEGE</title>
<style>
:root{--g:#087f3e;--g2:#055d2d;--bg:#f3f6f4;--text:#18221c;--muted:#66736b;--line:#dfe7e2;--card:#fff;--danger:#b42318;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:var(--g);color:#fff;font-weight:700}button:hover{background:var(--g2)}button.secondary{background:#e8efeb;color:var(--text)}button.danger{background:var(--danger)}.wrap{max-width:1280px;margin:auto;padding:18px}.login{max-width:620px;margin:7vh auto}.card{background:var(--card);border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 2px 14px #0000000d;border:1px solid var(--line)}header{background:var(--g);color:#fff;padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{margin:0;font-size:23px}header small{opacity:.9}.status{padding:7px 10px;border-radius:20px;font-weight:700;background:#fff;color:var(--g)}.offline{background:#fff1c7;color:#765500}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:var(--g2)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}label{font-weight:700;font-size:14px}input,select,textarea{width:100%;border:1px solid #cfd9d3;border-radius:9px;padding:11px;background:#fff}textarea{min-height:90px}.stat{background:#eef8f1;border:1px solid #d7ecdd;border-radius:12px;padding:15px}.stat b{display:block;font-size:29px;margin-top:5px}.muted{color:var(--muted);font-size:13px}.msg{margin-top:10px;font-weight:700}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f6f9f7}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}.pass,.approved{background:#daf5e0;color:#176b2e}.fail,.rejected{background:#ffe1e1;color:#9d1c1c}.pending{background:#fff0bf;color:#775500}.info{background:#e4f0ff;color:#17518f}.feature{display:flex;flex-wrap:wrap;gap:8px}.feature span{background:#f0f4f1;padding:8px 10px;border-radius:9px}.photo-preview{width:110px;height:130px;border:1px solid #bbb;object-fit:cover;background:#f7f7f7}.searchrow{display:flex;gap:8px}.searchrow input{flex:1}.dangerText{color:var(--danger)}
/* Certificate based on the college form supplied by the user */
.certificate-page{background:#fff;padding:15px}.certificate-sheet{position:relative;width:100%;max-width:1400px;margin:auto;aspect-ratio:1.4142;background:url('assets/certificate-form.jpg') center/100% 100% no-repeat;overflow:hidden}.cert-field{position:absolute;font-family:Arial,sans-serif;color:#111;font-weight:700}.cert-photo{position:absolute;left:82.0%;top:16.2%;width:10.6%;height:15.0%;object-fit:cover;border:1px solid #222;background:#fff}.cert-trainee{left:57.5%;top:35.7%;width:31%;font-size:1.65vw;color:#008aa7;background:rgba(255,255,255,.96);padding:2px 5px}.cert-profession{left:68.5%;top:42.5%;width:25%;font-size:1.35vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-level{left:69.5%;top:48.0%;width:23%;font-size:1.35vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-period{left:69.5%;top:53.3%;width:25%;font-size:1.15vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-id{left:12.0%;top:22.5%;width:20%;font-size:1vw}.cert-name-left{left:24%;top:35.0%;width:28%;font-size:1.35vw;color:#008aa7;background:rgba(255,255,255,.96);padding:2px 5px}.cert-prof-left{left:24%;top:42.0%;width:28%;font-size:1.2vw;background:rgba(255,255,255,.96);padding:2px 5px}.cert-score{left:70%;top:60.0%;width:18%;font-size:1.3vw}.cert-date{left:61%;top:69.5%;width:25%;font-size:1.1vw}.cert-checker{left:15%;top:69.0%;width:27%;font-size:1.1vw}.cert-status{left:43%;top:83%;width:15%;font-size:1vw;text-align:center}.print-actions{display:flex;gap:8px;justify-content:center;margin:15px auto;flex-wrap:wrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid,.two{grid-template-columns:1fr}.wrap{padding:10px}header{align-items:flex-start;flex-direction:column}.login{margin:25px auto}.searchrow{flex-direction:column}.cert-trainee{font-size:2.4vw}.cert-profession,.cert-level{font-size:2.1vw}.cert-period,.cert-score{font-size:1.8vw}}
@media print{body{background:#fff}.no-print{display:none!important}.certificate-page{padding:0}.certificate-sheet{max-width:none;width:100vw;height:70.71vw;aspect-ratio:auto}.wrap,header,#tabs,.card:not(.certificate-page){display:none!important}}
</style>
</head>
<body>
<div id="loginView" class="wrap"><div class="card login"><div style="text-align:center"><img src="assets/bedeno-logo.svg" alt="BEDENO TVET COLLEGE" style="width:92px;height:92px;border-radius:18px"></div><h1>BEDENO TVET COLLEGE</h1><p>Training Management & Certification System</p><div style="text-align:right;margin-bottom:10px"><button class="secondary" onclick="toggleLang()" id="langBtn">🌐 Afaan Oromoo</button></div><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password"></div><button style="width:100%" onclick="login()">LOGIN</button><p id="loginMsg" class="muted">Enter your assigned username and password.</p></div></div>
<div id="app" class="hidden"><header><div style="display:flex;align-items:center;gap:12px"><img src="assets/bedeno-logo.svg" alt="BEDENO" style="width:52px;height:52px;border-radius:10px"><div><h1>BEDENO TVET COLLEGE</h1><small>Training Management & Certification System</small></div></div><div><span id="net" class="status">Checking...</span> <button class="secondary" onclick="toggleLang()" id="langBtn2">🌐 Afaan Oromoo</button> <button class="secondary" onclick="logout()">Logout</button></div></header><main class="wrap"><div id="who" class="card"></div><div id="tabs" class="tabs"></div><section id="dashboard"></section><section id="registration" class="hidden"></section><section id="scores" class="hidden"></section><section id="trainees" class="hidden"></section><section id="certificates" class="hidden"></section><section id="settings" class="hidden"></section></main></div>
<script>
const REMOTE_API='https://bedeno-tvet-college.onrender.com/api';
const API=(location.protocol==='file:'||location.hostname==='localhost'&&location.port==='8080')?REMOTE_API:location.origin+'/api';
let token=localStorage.getItem('btc_token')||'',role=localStorage.getItem('btc_role')||'',username=localStorage.getItem('btc_user')||'';
let queue=JSON.parse(localStorage.getItem('btc_queue')||'[]');
let trainingCache=[];
const ROLE_NAMES={ADMIN:'Admin IT',COLLEGE:'Register College / Registrar',DEAN:'Dean College',COORDINATOR:'Training Coordinator',TRAINER:'Trainer',TRAINEE:'Trainee'};
const TAB_ACCESS={ADMIN:['dashboard','registration','scores','trainees','certificates','settings'],COLLEGE:['dashboard','registration','trainees','certificates'],DEAN:['dashboard','trainees','certificates'],COORDINATOR:['dashboard','scores','trainees','settings'],TRAINER:['dashboard','scores','trainees'],TRAINEE:['dashboard','trainees','certificates']};
const TAB_NAMES={dashboard:'📊 Dashboard',registration:'🆔 Registration',scores:'📝 Score Entry',trainees:'👥 Trainees',certificates:'📜 Certificates',settings:'⚙️ Settings'};
let lang=localStorage.getItem('btc_lang')||'om';
const I18N={
'Username':'Maqaa fayyadamaa','Password':'Jecha iccitii','LOGIN':'SEENI','Logout':'BA\'I','ONLINE':'INTARNEETII JIRA','OFFLINE':'INTARNEETII HIN JIRRE','Dashboard':'Daashboordii','Registration':'Galmee','Score Entry':'Qabxii Galchuu','Trainees':'Leenjifamtoota','Certificates':'Ragaa Xumuraa','Settings':'Qindaa’ina','Full Name *':'Maqaa Guutuu *','Phone':'Bilbila','Gender':'Saala','Male':'Dhiira','Female':'Dhalaa','Gosa Ogummaa / Profession *':'Gosa Ogummaa *','Training *':'Leenjii *','Starting Level':'Sadarkaa Jalqabaa','Training Start Date':'Guyyaa Jalqaba Leenjii','Training End Date':'Guyyaa Xumura Leenjii','Trainee Photo':'Suuraa Leenjifamaa','REGISTER TRAINEE':'LEENJIFAMAA GALMEESSI','SEARCH':'BARBAADI','ADD PROFESSION':'GOSA OGUMMAA DABALI','CREATE USER':'FAYYADAMAA UUMI','Enable':'BANI','Disable':'CUGI','New Profession / Gosa Ogummaa':'Gosa Ogummaa Haaraa','Training Name':'Maqaa Leenjii','Levels (1–4)':'Sadarkaa (1–4)','Pass Mark':'Qabxii Darbii','ADD TRAINING':'LEENJII DABALI','User & Permission Security':'Nageenya Fayyadamtootaa fi Hayyamaa','Profession Management':'Bulchiinsa Gosa Ogummaa','Training Management':'Bulchiinsa Leenjii','Permission controlled':'Hayyamaan to’atama','Trainee ID':'ID Leenjifamaa','Current Level':'Sadarkaa Ammaa','Score':'Qabxii','Grade':'Sadarkaa','Status':'Haala','Active':'Hojii Irra Jira','Completed':'Xumure','Pending':'Eegamaa Jira','Approved':'Ragaa Eeyyamame','Request Certificate':'Ragaa Gaafadhu','APPROVE':'EEYYAMI','REJECT':'DIDDI','Export CSV':'CSV BAASI','Enter your assigned username and password.':'Maqaa fayyadamaa fi jecha iccitii siif kenname galchi.','Training Management & Certification System':'Sirna Bulchiinsa Leenjii fi Ragaa Xumuraa'};
const OROMO_TO_EN=Object.fromEntries(Object.entries(I18N).map(([k,v])=>[v,k]));
function trText(v){return lang==='om'?(I18N[v]||v):(OROMO_TO_EN[v]||v)}
function toggleLang(){
  lang=lang==='om'?'en':'om';
  localStorage.setItem('btc_lang',lang);
  translatePage();
  if(typeof show==='function'&&role){
    const active=document.querySelector('#tabs button.active');
    const section=active?.id?.replace('tab_','')||'dashboard';
    show(section);
    setTimeout(()=>translatePage(),100);
  }
}
function translatePage(){document.querySelectorAll('label,button,p,h1,h2,h3,small,th,span').forEach(el=>{if(el.children.length===0){const x=el.textContent.trim();if(I18N[x])el.textContent=trText(x)}});document.querySelectorAll('input[placeholder],select option').forEach(el=>{const x=(el.placeholder||el.textContent||'').trim();if(I18N[x]){if(el.placeholder)el.placeholder=trText(x);else el.textContent=trText(x)}});document.documentElement.lang=lang==='om'?'om':'en';const b=document.getElementById('langBtn');const b2=document.getElementById('langBtn2');if(b)b.textContent=lang==='om'?'🌐 English':'🌐 Afaan Oromoo';if(b2)b2.textContent=lang==='om'?'🌐 English':'🌐 Afaan Oromoo'}
function toggleLang(){lang=lang==='om'?'en':'om';localStorage.setItem('btc_lang',lang);translatePage();if(typeof show==='function'&&role)show(document.querySelector('#tabs button.active')?.id?.replace('tab_','')||'dashboard')}
async function checkSetup(){try{const d=await fetch(REMOTE_API+'/setup/status').then(r=>r.json());if(d.required){loginView.querySelector('.login').insertAdjacentHTML('beforeend','<div id="setupBox" class="card" style="margin-top:15px"><h3>🔐 First Administrator Setup</h3><p>Create the first secure administrator account. The old default admin account is not accepted.</p><div class="field"><label>New Admin Username</label><input id="setupUser"></div><div class="field"><label>New Admin Password</label><input id="setupPass" type="password"></div><button style="width:100%" onclick="createFirstAdmin()">CREATE ADMINISTRATOR</button><p id="setupMsg" class="msg"></p></div>');}}catch(e){}translatePage()}
async function createFirstAdmin(){try{const u=setupUser.value.trim(),p=setupPass.value;if(u.length<4||p.length<8)throw new Error('Username 4+ and password 8+ characters required');const r=await fetch(REMOTE_API+'/setup/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Setup failed');setupMsg.textContent='Administrator created. You can now login.';document.getElementById('setupBox').remove()}catch(e){setupMsg.textContent=e.message}}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function login(){loginMsg.textContent='Signing in...';try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:loginUser.value,password:loginPass.value})});token=d.token;role=d.role;username=d.username;localStorage.setItem('btc_token',token);localStorage.setItem('btc_role',role);localStorage.setItem('btc_user',username);boot()}catch(e){loginMsg.textContent=e.message}}
function logout(){localStorage.removeItem('btc_token');localStorage.removeItem('btc_role');localStorage.removeItem('btc_user');location.reload()}
function boot(){loginView.classList.add('hidden');translatePage();app.classList.remove('hidden');who.innerHTML='<b>Logged in:</b> '+esc(username)+' &nbsp; | &nbsp; <b>Role:</b> '+esc(ROLE_NAMES[role]||role)+' <span class="badge info">Permission controlled</span>';buildTabs();show('dashboard');updateNet();window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);setInterval(syncOffline,7000)}
function buildTabs(){tabs.innerHTML=(TAB_ACCESS[role]||[]).map(id=>`<button id="tab_${id}" onclick="show('${id}')">${TAB_NAMES[id]}</button>`).join('')}
function show(id){if(!(TAB_ACCESS[role]||[]).includes(id))return;['dashboard','registration','scores','trainees','certificates','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));const b=document.getElementById('tab_'+id);if(b)b.classList.add('active');if(id==='dashboard')loadDash();if(id==='registration')loadReg();if(id==='scores')loadScores();if(id==='trainees')loadTrainees();if(id==='certificates')loadCerts();if(id==='settings')loadSettings()}
function updateNet(){const online=navigator.onLine;net.textContent=online?'ONLINE':'OFFLINE';net.className='status '+(online?'':'offline');if(online)syncOffline()}
async function syncOffline(){if(!navigator.onLine||!queue.length||!token)return;for(const item of [...queue]){try{const d=await api('/sync/trainee',{method:'POST',body:JSON.stringify(item.data)});queue=queue.filter(x=>x.local_id!==item.local_id);localStorage.setItem('btc_queue',JSON.stringify(queue));if(window.regmsg)regmsg.textContent='Offline record synced successfully. Official ID: '+d.trainee.trainee_id}catch(e){}}}
async function loadDash(){
    try {
        if(!navigator.onLine){
            dashboard.innerHTML = `
                <div class="card">
                    <h2>📴 Offline Mode</h2>
                    <p>
                        Registration can continue offline.
                        Saved records will sync automatically when internet returns.
                    </p>

                    <div class="feature">
                        <span>📴 Offline Registration</span>
                        <span>🔄 Auto Sync</span>
                    </div>
                </div>
            `;
            return;
        }

        const d = await api('/dashboard');

        dashboard.innerHTML = `
            <div class="card dashboard-head">
                <div>
                    <h2>👋 Welcome, ${esc(username)}</h2>
                    <p class="muted">
                        BEDENO TVET COLLEGE Training Management System
                    </p>
                </div>

                <span class="badge info">
                    ${esc(ROLE_NAMES[role] || role)}
                </span>
            </div>

            <div class="grid dashboard-stats">

                <div class="stat">
                    <span>👨‍🎓 Total Trainees</span>
                    <b>${d.trainees}</b>
                </div>

                <div class="stat">
                    <span>📚 Active Training</span>
                    <b>${d.active}</b>
                </div>

                <div class="stat">
                    <span>🎓 Completed</span>
                    <b>${d.completed}</b>
                </div>

                <div class="stat">
                    <span>⏳ Pending Certificates</span>
                    <b>${d.pending}</b>
                </div>

                <div class="stat">
                    <span>✅ Approved Certificates</span>
                    <b>${d.approved}</b>
                </div>

            </div>

            <div class="card">
                <h2>⚡ Quick Access</h2>

                <div class="feature">

                    <button onclick="show('registration')">
                        🆔 Register Trainee
                    </button>

                    <button onclick="show('scores')">
                        📝 Enter Result
                    </button>

                    <button onclick="show('trainees')">
                        👥 Trainee List
                    </button>

                    <button onclick="show('certificates')">
                        📜 Certificates
                    </button>

                    ${
                        role === 'ADMIN'
                        ? `
                            <button onclick="show('settings')">
                                ⚙️ System Settings
                            </button>
                        `
                        : ''
                    }

                </div>
            </div>

            <div class="card">
                <h2>🏫 BEDENO TVET COLLEGE</h2>

                <p>
                    Training, trainee registration, result management
                    and certificate management system.
                </p>

                <div class="feature">
                    <span>🎓 Level 1–4</span>
                    <span>📝 Automatic Grade</span>
                    <span>📜 Certificate Approval</span>
                    <span>🔐 Role Permissions</span>
                    <span>📱 Mobile Support</span>
                    <span>📴 Offline Registration</span>
                </div>
            </div>
        `;

    } catch(e) {
        dashboard.innerHTML =
            '<div class="card dangerText">' +
            esc(e.message) +
            '</div>';
    }
}
async function loadReg(){try{let ps,ts;if(navigator.onLine){[ps,ts]=await Promise.all([api('/professions'),api('/trainings')]);}else{ps=JSON.parse(localStorage.getItem('btc_professions')||'[]');ts=JSON.parse(localStorage.getItem('btc_trainings')||'[]');if(!ps.length||!ts.length)throw new Error('Offline registration is ready after one successful online login and data sync.');}trainingCache=ts;localStorage.setItem('btc_professions',JSON.stringify(ps));localStorage.setItem('btc_trainings',JSON.stringify(ts));registration.innerHTML=`<div class="card"><h2>🆔 Trainee Registration</h2><p class="muted">Trainee ID is generated automatically as BTC-YYYY-0001. If the internet is unavailable, registration is saved on this device and synced automatically later.</p><div class="two"><div class="field"><label>Full Name *</label><input id="rname"></div><div class="field"><label>Phone</label><input id="rphone" inputmode="tel"></div><div class="field"><label>Gender</label><select id="rgender"><option>Male</option><option>Female</option></select></div><div class="field"><label>Gosa Ogummaa / Profession *</label><select id="rprof" onchange="filterTrainings()">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Training *</label><select id="rtraining"></select></div><div class="field"><label>Starting Level</label><select id="rlevel"><option>1</option><option>2</option><option>3</option><option>4</option></select></div><div class="field"><label>Training Start Date</label><input id="rstart" type="date"></div><div class="field"><label>Training End Date</label><input id="rend" type="date"></div><div class="field"><label>Trainee Photo</label><input id="rphoto" type="file" accept="image/*" onchange="previewPhoto()"><img id="photoPreview" class="photo-preview" alt="Photo preview"></div></div><button onclick="registerTrainee()">REGISTER TRAINEE</button><p id="regmsg" class="msg"></p></div>`;filterTrainings()}catch(e){registration.innerHTML='<div class="card dangerText">'+esc(e.message)+'</div>'}}
function filterTrainings(){if(!window.rprof||!window.rtraining)return;const pid=+rprof.value;const rows=trainingCache.filter(t=>+t.profession_id===pid);rtraining.innerHTML=rows.length?rows.map(t=>`<option value="${t.id}">${esc(t.name)} (${t.levels} Levels)</option>`).join(''):'<option value="">No training available</option>';const t=trainingCache.find(x=>+x.id===+(rtraining.value));rlevel.innerHTML=Array.from({length:t?.levels||4},(_,i)=>`<option>${i+1}</option>`).join('')}
function previewPhoto(){const f=rphoto.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>photoPreview.src=rd.result;rd.readAsDataURL(f)}
async function registerTrainee(){const file=rphoto.files[0];let photo=null;if(file){if(file.size>1200000){regmsg.textContent='Photo is too large. Please choose a photo under 1.2 MB.';return}photo=await fileToDataURL(file)}const data={full_name:rname.value.trim(),phone:rphone.value.trim(),gender:rgender.value,profession_id:+rprof.value,training_id:+rtraining.value,level:+rlevel.value,photo,start_date:rstart.value||null,end_date:rend.value||null};if(!data.full_name){regmsg.textContent='Full name is required';return}const local_id=crypto.randomUUID?crypto.randomUUID():'local-'+Date.now()+'-'+Math.random();data.local_id=local_id;if(!navigator.onLine){queue.push({local_id,data});localStorage.setItem('btc_queue',JSON.stringify(queue));regmsg.textContent='Saved OFFLINE. Automatic sync will happen when internet returns.';rname.value='';rphone.value='';return}try{const d=await api('/trainees',{method:'POST',body:JSON.stringify(data)});regmsg.textContent='Registered successfully. Official Trainee ID: '+d.trainee_id;rname.value='';rphone.value='';loadDash()}catch(e){regmsg.textContent=e.message}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file)})}
async function loadScores(){scores.innerHTML=`<div class="card"><h2>📝 Trainer → Score → Automatic Grade</h2><div class="searchrow"><input id="sid" placeholder="Trainee ID e.g. BTC-2026-0001"><button onclick="lookupTrainee()">SEARCH</button></div><div id="scoreInfo"></div></div>`}
async function lookupTrainee(){try{const t=await api('/trainees/'+encodeURIComponent(sid.value.trim()));scoreInfo.innerHTML=`<div class="card"><b>${esc(t.full_name)}</b> | ${esc(t.profession)} | ${esc(t.training)} | Current Level: <b>${t.current_level}</b><div class="two" style="margin-top:12px"><div class="field"><label>Level</label><select id="slevel">${Array.from({length:t.levels},(_,i)=>`<option value="${i+1}" ${i+1===t.current_level?'selected':''}>Level ${i+1}</option>`).join('')}</select></div><div class="field"><label>Score (0–100)</label><input id="sscore" type="number" min="0" max="100"></div></div><button onclick="saveScore()">SAVE SCORE & GRADE</button><p id="scoremsg" class="msg"></p><hr><b>History</b><div class="tablewrap"><table><tr><th>Level</th><th>Score</th><th>Grade</th><th>Status</th><th>Date</th></tr>${t.results.map(r=>`<tr><td>${r.level}</td><td>${r.score}</td><td>${r.grade}</td><td><span class="badge ${r.status==='PASS'?'pass':'fail'}">${r.status}</span></td><td>${r.date}</td></tr>`).join('')}</table></div></div>`}catch(e){scoreInfo.innerHTML='<p class="dangerText">'+esc(e.message)+'</p>'}}
async function saveScore(){try{const d=await api('/results',{method:'POST',body:JSON.stringify({trainee_id:sid.value.trim(),level:+slevel.value,score:+sscore.value})});scoremsg.textContent=`Saved. Grade: ${d.grade} — ${d.status}. ${d.trainee.status==='Completed'?'All levels completed.':'Next/current level: '+d.trainee.current_level}`;lookupTrainee()}catch(e){scoremsg.textContent=e.message}}
async function loadTrainees(){try{const rows=await api('/trainees');window._rows=rows;trainees.innerHTML=`<div class="card"><h2>👥 Trainee Search & List</h2><div class="searchrow"><input id="findId" placeholder="Search Trainee ID"><button onclick="searchTrainee()">SEARCH</button></div><div id="findResult"></div><hr><button onclick="exportCSV()">📥 Excel Export (CSV)</button><div class="tablewrap" style="margin-top:12px"><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Profession</th><th>Training</th><th>Level</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${esc(x.trainee_id)}</td><td>${esc(x.full_name)}</td><td>${esc(x.phone||'')}</td><td>${esc(x.profession)}</td><td>${esc(x.training)}</td><td>${x.current_level}</td><td><span class="badge ${x.status==='Completed'?'approved':'info'}">${x.status}</span></td></tr>`).join('')}</table></div></div>`}catch(e){trainees.innerHTML='<div class="card dangerText">'+esc(e.message)+'</div>'}}
async function searchTrainee(){try{const t=await api('/trainees/'+encodeURIComponent(findId.value.trim()));findResult.innerHTML=`<div class="card"><h3>${esc(t.full_name)}</h3><p><b>ID:</b> ${t.trainee_id}<br><b>Profession:</b> ${esc(t.profession)}<br><b>Training:</b> ${esc(t.training)}<br><b>Current Level:</b> ${t.current_level}<br><b>Status:</b> ${t.status}<br><b>Training Period:</b> ${t.start_date||'-'} → ${t.end_date||'-'}</p><h4>Results</h4><div class="tablewrap"><table><tr><th>Level</th><th>Score</th><th>Grade</th><th>Status</th></tr>${t.results.map(r=>`<tr><td>${r.level}</td><td>${r.score}</td><td>${r.grade}</td><td>${r.status}</td></tr>`).join('')}</table></div>${t.certificate?`<p>Certificate: <span class="badge ${t.certificate.status==='APPROVED'?'approved':t.certificate.status==='REJECTED'?'rejected':'pending'}">${t.certificate.status}</span> ${t.certificate.certificate_no}</p>${t.certificate.status==='APPROVED'?`<button onclick="openCertificate('${t.certificate.certificate_no}')">📜 OPEN / PRINT CERTIFICATE</button>`:''}`:''}</div>`}catch(e){findResult.innerHTML='<p class="dangerText">'+esc(e.message)+'</p>'}}
function exportCSV(){const rows=window._rows||[];const head=['Trainee ID','Full Name','Phone','Gender','Profession','Training','Level','Status','Start Date','End Date','Registration Date'];const csv=[head,...rows.map(x=>[x.trainee_id,x.full_name,x.phone,x.gender,x.profession,x.training,x.current_level,x.status,x.start_date,x.end_date,x.registration_date])].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='BEDENO_TVET_TRAINEES.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function loadCerts(){let html='<div class="card"><h2>📜 Certificate Management</h2>';if(['ADMIN','COLLEGE','DEAN'].includes(role)){try{const p=await api('/certificates/pending');html+=`<h3>Pending Approval</h3><div class="tablewrap"><table><tr><th>Certificate</th><th>Trainee</th><th>Profession</th><th>Score</th><th>Action</th></tr>${p.map(c=>`<tr><td>${c.certificate_no}</td><td>${esc(c.full_name)}<br>${c.trainee_id}</td><td>${esc(c.profession)}</td><td>${c.final_score} (${c.final_grade})</td><td><button onclick="decision('${c.certificate_no}','APPROVED')">APPROVE</button> <button class="danger" onclick="decision('${c.certificate_no}','REJECTED')">REJECT</button></td></tr>`).join('')}</table></div>`}catch(e){html+='<p class="dangerText">'+esc(e.message)+'</p>'}}if(role==='TRAINEE'){html+=`<p>After completing Level 1–4, enter your Trainee ID and request a certificate.</p><div class="searchrow"><input id="cid" placeholder="BTC-2026-0001"><button onclick="requestCert()">REQUEST CERTIFICATE</button></div><p id="certmsg" class="msg"></p>`}html+=`<hr><div class="card"><b>Approval flow:</b> Completed → Request → PENDING → Dean/College Responsible checks → APPROVED or REJECTED → Only APPROVED certificate can be printed/finalized.</div></div>`;certificates.innerHTML=html}
async function requestCert(){try{const d=await api('/certificates/request',{method:'POST',body:JSON.stringify({trainee_id:cid.value.trim()})});certmsg.textContent='Certificate '+d.certificate_no+' is '+d.status+'.'}catch(e){certmsg.textContent=e.message}}
async function decision(no,status){const remarks=status==='REJECTED'?prompt('Reason for rejection:')||'':'';try{await api('/certificates/'+encodeURIComponent(no)+'/decision',{method:'POST',body:JSON.stringify({status,remarks})});loadCerts()}catch(e){alert(e.message)}}
async function openCertificate(no){try{const c=await api('/certificates/'+encodeURIComponent(no));const photo=c.photo||'';const start=c.start_date||'-';const end=c.end_date||'-';const approved=c.approved_at?new Date(c.approved_at).toLocaleDateString():(c.registration_date?new Date(c.registration_date).toLocaleDateString():new Date().toLocaleDateString());const levelText='Level I–'+c.levels;const win=window.open('','_blank');if(!win){alert('Please allow pop-ups for this site.');return}win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(c.certificate_no)}</title><style>@page{size:A4 landscape;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}.sheet{position:relative;width:100vw;height:70.71vw;background:url('${location.origin}/assets/certificate-form.jpg') center/100% 100% no-repeat;overflow:hidden}.f{position:absolute;font-family:Arial,sans-serif;color:#111;font-weight:700;line-height:1.15;z-index:3}.box{background:rgba(255,255,255,.98);padding:2px 5px}.mask{position:absolute;background:#fff;z-index:2}.photo{left:82%;top:16.2%;width:10.6%;height:15%;object-fit:cover;border:1px solid #222;background:#fff}.id{left:10.5%;top:21.0%;width:24%;font-size:1vw}.rid{left:51.5%;top:21.0%;width:25%;font-size:1vw}.leftname{left:23%;top:34.2%;width:25%;font-size:1.35vw;color:#008aa7}.leftprof{left:22%;top:38.0%;width:25%;font-size:1.2vw}.leftlevel{left:22%;top:41.2%;width:12%;font-size:1.2vw}.leftstart{left:7.0%;top:44.0%;width:11%;font-size:1.1vw}.leftend{left:20%;top:44.0%;width:14%;font-size:1.1vw}.trainee{left:57.5%;top:35.7%;width:31%;font-size:1.65vw;color:#008aa7}.prof{left:68.5%;top:42.5%;width:25%;font-size:1.35vw}.level{left:76%;top:46.8%;width:17%;font-size:1.35vw}.period{left:68%;top:50.7%;width:27%;font-size:1.15vw}.score{left:69.5%;top:59%;font-size:1.2vw}.checker{left:15%;top:69%;font-size:1.05vw}.date{left:61%;top:69.5%;font-size:1.05vw}.status{left:43%;top:83%;width:15%;text-align:center;font-size:1vw}</style></head><body><div class="sheet">${photo?`<img class="f photo" src="${photo}">`:''}<div class="mask" style="left:10%;top:20.2%;width:27%;height:3.8%"></div><div class="mask" style="left:51%;top:20.2%;width:29%;height:3.8%"></div><div class="mask" style="left:23%;top:33.4%;width:27%;height:4.8%"></div><div class="mask" style="left:6%;top:37.4%;width:42%;height:4.4%"></div><div class="mask" style="left:20%;top:40.2%;width:18%;height:3.8%"></div><div class="mask" style="left:6%;top:43%;width:34%;height:6.8%"></div><div class="mask" style="left:56%;top:34.7%;width:34%;height:5.0%"></div><div class="mask" style="left:67%;top:41.5%;width:27%;height:4.3%"></div><div class="mask" style="left:74%;top:45.5%;width:20%;height:4.3%"></div><div class="mask" style="left:66%;top:49.5%;width:30%;height:5.8%"></div><div class="f id box">${esc(c.trainee_id)}</div><div class="f rid box">${esc(c.trainee_id)}</div><div class="f leftname box">${esc(c.full_name)}</div><div class="f leftprof box">${esc(c.profession)}</div><div class="f leftlevel box">${esc(levelText)}</div><div class="f leftstart box">${esc(start)}</div><div class="f leftend box">${esc(end)}</div><div class="f trainee box">${esc(c.full_name)}</div><div class="f prof box">${esc(c.profession)}</div><div class="f level box">${esc(levelText)}</div><div class="f period box">${esc(start)} → ${esc(end)}</div><div class="f score box">${c.final_score} (${esc(c.final_grade)})</div><div class="f checker box">${esc(c.checked_by||'College Responsible')}</div><div class="f date box">${esc(approved)}</div><div class="f status box">APPROVED</div></div><script>window.onload=()=>setTimeout(()=>window.print(),700)<\/script></body></html>`);win.document.close()}catch(e){alert(e.message)}}
async function changeMyPassword(){try{await api('/auth/change-password',{method:'POST',body:JSON.stringify({current_password:cp.value,new_password:cnew.value})});passmsg.textContent='Password changed successfully. Please login again.';setTimeout(logout,800)}catch(e){passmsg.textContent=e.message}}
async function resetUserPassword(id){const p=prompt('Enter new password (8+ characters):');if(!p)return;try{await api('/users/'+id+'/reset-password',{method:'POST',body:JSON.stringify({password:p})});alert('Password reset successfully')}catch(e){alert(e.message)}}
async function loadAudit(){try{const rows=await api('/audit/login');auditBox.innerHTML='<table><tr><th>User</th><th>Success</th><th>IP</th><th>Location</th><th>Device</th><th>Date</th></tr>'+rows.map(x=>`<tr><td>${esc(x.username)}</td><td>${x.success?'YES':'NO'}</td><td>${esc(x.ip)}</td><td>${esc(x.location)}</td><td>${esc(x.user_agent).slice(0,70)}</td><td>${esc(x.created_at)}</td></tr>`).join('')+'</table>'}catch(e){auditBox.innerHTML='<p class="dangerText">'+esc(e.message)+'</p>'}}
async function loadSettings(){if(!['ADMIN','COORDINATOR'].includes(role))return;let html='<div class="card"><h2>⚙️ Settings</h2>';if(role==='ADMIN'){try{const u=await api('/users');html+=`<h3>🔐 User & Permission Security</h3><div class="two"><div class="field"><label>Username</label><input id="nu"></div><div class="field"><label>Password</label><input id="np" type="password"></div><div class="field"><label>Role</label><select id="nr">${Object.entries(ROLE_NAMES).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></div></div><button onclick="addUser()">CREATE USER</button><div class="tablewrap" style="margin-top:15px"><table><tr><th>Username</th><th>Role</th><th>Active</th><th>Action</th></tr>${u.map(x=>`<tr><td>${esc(x.username)}</td><td>${ROLE_NAMES[x.role]||x.role}</td><td>${x.active?'YES':'NO'}</td><td><button class="secondary" onclick="toggleUser(${x.id})">${x.active?'Disable':'Enable'}</button> <button class="secondary" onclick="resetUserPassword(${x.id})">Reset Password</button></td></tr>`).join('')}</table></div>`}catch(e){html+='<p class="dangerText">'+esc(e.message)+'</p>'}}html+=`<hr><h3>🔑 Change My Password</h3><div class="two"><div class="field"><label>Current Password</label><input id="cp" type="password"></div><div class="field"><label>New Password</label><input id="cnew" type="password"></div></div><button onclick="changeMyPassword()">CHANGE PASSWORD</button><p id="passmsg" class="msg"></p>`;
if(role==='ADMIN') html+=`<hr><h3>📍 Login Audit</h3><button class="secondary" onclick="loadAudit()">REFRESH LOGIN LOGS</button><div id="auditBox" class="tablewrap" style="margin-top:10px"></div>`;
html+=`<hr><h3>🎓 Profession Management</h3><div class="two"><div class="field"><label>New Profession / Gosa Ogummaa</label><input id="pn" placeholder="e.g. Information Technology"></div></div><button onclick="addProfession()">ADD PROFESSION</button><p id="profmsg" class="msg"></p><hr><h3>📚 Training Management</h3><div class="two"><div class="field"><label>Profession</label><select id="tp"></select></div><div class="field"><label>Training Name</label><input id="tn"></div><div class="field"><label>Levels (1–4)</label><select id="tl"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></div><div class="field"><label>Pass Mark</label><input id="tm" type="number" value="60"></div></div><button onclick="addTraining()">ADD TRAINING</button><p id="setmsg" class="msg"></p></div>`;settings.innerHTML=html;if(role==='ADMIN')loadProfessionOptions()}
async function loadProfessionOptions(){try{const ps=await api('/professions');const sel=document.getElementById('tp');if(sel)sel.innerHTML=ps.map(p=>`<option value="${p.id}">${esc(p.name)} (ID ${p.id})</option>`).join('')}catch(e){}}
async function addProfession(){try{const name=document.getElementById('pn').value.trim();if(!name)throw new Error('Profession name is required');await api('/professions',{method:'POST',body:JSON.stringify({name})});document.getElementById('pn').value='';document.getElementById('profmsg').textContent='Profession added successfully';await loadProfessionOptions()}catch(e){document.getElementById('profmsg').textContent=e.message}}
async function addUser(){try{await api('/users',{method:'POST',body:JSON.stringify({username:nu.value.trim(),password:np.value,role:nr.value})});setmsg.textContent='User created successfully';loadSettings()}catch(e){setmsg.textContent=e.message}}
async function toggleUser(id){try{await api('/users/'+id+'/toggle',{method:'POST'});loadSettings()}catch(e){alert(e.message)}}
async function addTraining(){try{await api('/trainings',{method:'POST',body:JSON.stringify({profession_id:+tp.value,name:tn.value.trim(),levels:+tl.value,pass_mark:+tm.value})});setmsg.textContent='Training created successfully';loadSettings()}catch(e){setmsg.textContent=e.message}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
translatePage();checkSetup();if(token)boot();
</script>
