name: Build BEDENO TVET Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BEDENO_TVET_GITHUB_APK_BUILD.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q BEDENO_TVET_GITHUB_APK_BUILD.zip -d build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: build-src/bedeno_fullstack/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BEDENO-TVET-College-APK
          path: build-src/bedeno_fullstack/android/app/build/outputs/apk/debug/app-debug.apk
