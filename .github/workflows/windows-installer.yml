name: Build BEDENO TVET College Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows EXE
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: BEDENO-TVET-College-Windows-Installer
          path: desktop/dist/*.exe
